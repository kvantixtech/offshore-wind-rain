name: probe
# Temporary, on the branch "probe" only: finds the turbine registers before tools/farms.py is written. No rain data.
on:
  push:
    branches: ["probe"]
    paths: ["probe/*.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe.py 2>&1 | tee probe/stdout.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/ && git commit -qm "probe result" && git push -q
