name: gauges
# Step 2 of the order of work in METHOD.md: gauge list and day counts. Outputs no precipitation amount.
on:
  push:
    branches: ["main"]
    paths: ["tools/gauges.py", ".github/workflows/gauges.yml"]
permissions:
  contents: write
concurrency:
  group: gauges
  cancel-in-progress: false
jobs:
  gauges:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data && python3 tools/gauges.py 2>&1 | tee data/gauges_run.log; exit ${PIPESTATUS[0]}
        shell: bash
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ && git commit -qm "gauges: series and day counts (tools/gauges.py)" && git pull -q --rebase && git push -q || echo "nothing to commit"
