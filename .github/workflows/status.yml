name: status
# Rewrites data/status.json (what the live page shows) after a change pushed by hand. Workflows that commit data run
# tools/status.py themselves, because pushes made by a workflow do not start other workflows.
on:
  push:
    branches: ["main"]
    paths: ["tools/status.py", ".github/workflows/status.yml", "METHOD.md", "CHANGELOG.md", "results/**", "data/exposure/**", "data/power/**"]
permissions:
  contents: write
concurrency:
  group: status
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python3 tools/status.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json && git commit -qm "status (tools/status.py)" && git pull -q --rebase && git push -q || echo "no status change"
